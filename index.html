<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>簡報產生器｜登入</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f4ede0;color:#3a2e22;
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;}
.box{width:min(92vw,380px);background:#fffbf3;border:1px solid #e3d6bf;border-radius:18px;
  padding:28px 24px;text-align:center;box-shadow:0 6px 24px rgba(90,65,30,.10);}
h1{font-size:20px;margin:0 0 4px;background:linear-gradient(90deg,#c0392b,#9a6b12);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:12px;color:#6f604d;margin-bottom:20px;}
input{width:100%;padding:13px;margin-top:10px;border-radius:12px;border:1.5px solid #e3d6bf;
  background:#f6efe2;color:#3a2e22;font-size:16px;}
input:focus{outline:none;border-color:#c0392b;}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:#6f604d;margin-top:14px;}
label input{width:16px;height:16px;margin:0;accent-color:#c0392b;}
button{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;font-size:16px;
  font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#c0392b,#9e2a20);}
#err{display:none;margin-top:12px;font-size:13px;color:#a8322a;}
#busy{display:none;margin-top:12px;font-size:13px;color:#6f604d;}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>🎞️ 簡報產生器</h1>
  <div class="sub">請登入使用</div>
  <input id="u" placeholder="帳號" autocomplete="username" required>
  <input id="p" type="password" placeholder="密碼" autocomplete="current-password" required>
  <label><input type="checkbox" id="rm" checked>記住我（這台裝置之後免登入）</label>
  <button>登入</button>
  <div id="busy">解鎖中，請稍候…</div>
  <div id="err">帳號或密碼不正確</div>
</form>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>Uint8Array.from(h.match(/../g),x=>parseInt(x,16));
const subtle=crypto.subtle,enc=new TextEncoder(),dec=new TextDecoder();
const LS='pptgen_kek';

// 由密碼導出 KEK（只跟密碼＋鹽有關，所以跨版本穩定）
async function deriveKek(pass,saltB64){
  const base=await subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await subtle.deriveBits(
    {name:'PBKDF2',salt:d64(saltB64),iterations:DATA.iter,hash:'SHA-256'},base,256));
}
// 用 KEK 解開包裹，拿到這一版的主金鑰 K
async function unwrap(acc,kekBytes){
  const kek=await subtle.importKey('raw',kekBytes,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:d64(acc.i)},kek,d64(acc.w)));
}
async function open(K){
  const kKey=await subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const pt=await subtle.decrypt({name:'AES-GCM',iv:d64(DATA.ivP)},kKey,d64(DATA.ct));
  const html=dec.decode(pt);
  // 不用 document.write（含外部資源時會吃掉整個 body，見 播音部署_build.mjs 2026-09-06 註解）
  if(document.readyState==='loading')
    await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  const parsed=new DOMParser().parseFromString(html,'text/html');
  document.replaceChild(document.importNode(parsed.documentElement,true),document.documentElement);
  for(const oldTag of [...document.querySelectorAll('script')]){
    const s=document.createElement('script');
    for(const a of oldTag.attributes) s.setAttribute(a.name,a.value);
    if(oldTag.src){
      const done=new Promise(r=>{ s.onload=r; s.onerror=r; });
      oldTag.parentNode.replaceChild(s,oldTag);
      await done;
    }else{
      s.textContent=oldTag.textContent;
      oldTag.parentNode.replaceChild(s,oldTag);
    }
  }
}

    if(!saved)return;
    const i=saved.indexOf(':');
    const u=saved.slice(0,i), kekHex=saved.slice(i+1);
    const acc=DATA.accounts.find(x=>x.u===u);
    if(!acc)throw new Error('帳號已移除');
    await open(await unwrap(acc,unhex(kekHex)));
  }catch(e){localStorage.removeItem(LS);}
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const err=document.getElementById('err'),busy=document.getElementById('busy');
  err.style.display='none';busy.style.display='block';
  await new Promise(r=>setTimeout(r,30));
  const a=DATA.accounts.find(x=>x.u.toLowerCase()===u.toLowerCase());
  if(!a){busy.style.display='none';err.style.display='block';return;}
  try{
    const kekBytes=await deriveKek(p,a.s);
    const K=await unwrap(a,kekBytes);
    if(document.getElementById('rm').checked)
      localStorage.setItem(LS,a.u+':'+hex(kekBytes));
    await open(K);
  }catch(ex){busy.style.display='none';err.style.display='block';}
});
</script>
